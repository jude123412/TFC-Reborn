; BuildCraft Community Edition machine balance
; Edit values and restart Minecraft/the server to apply.
; This file has its own independent use_config switch.
; Switching this file does NOT change the other balance file.

[meta]
schema_version = 1
; false = built-in BCCE machine defaults (edits in THIS file ignored)
; true = use the machine values from THIS file only
use_config = false

[machine.buildcraftfactory:pump]
energy_cost_multiplier = 1.0
work_speed_multiplier = 1.0
energy_per_bucket_mj = 10
tank_capacity_mb = 16000
max_distance_blocks = 64
consume_water_sources = 0

[machine.buildcraftfactory:distiller]
energy_cost_multiplier = 1.0
work_speed_multiplier = 1.0

