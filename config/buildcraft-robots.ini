; BuildCraft Community Edition robot balance
; Edit values and restart Minecraft/the server to apply.
; This file has its own independent use_config switch.
; Switching this file does NOT change the other balance file.

[meta]
schema_version = 1
; false = built-in BCCE robot defaults (edits in THIS file ignored)
; true = use the robot values from THIS file only
use_config = false

