
#Mechanical system global settings
[mechanical]
	#Global maximum rotational speed in RPM for all mechanical devices (turbines, alternators, etc.). Default 7200 RPM. Changing this affects speed_factor calculations in turbines.
	#Range: 1000 ~ 50000
	max_rpm = 7200

#Heat system global settings
[heat]
	#Global maximum heat level for all heat-related devices. Default 2000.0
	#Range: 100.0 ~ 10000.0
	max_heat = 2000.0

#Multiblock settings shared by every machine built on Immersive Convergence, Immersive Engineering's and Immersive Petroleum's included
[multiblocks]
	#How a machine comes apart. PROCESS_QUEUE breaks it down block by block over a few ticks and drops all its materials at the broken block; TEMPLATE_BLOCKS instantly reverts it to its placed blocks. Sneaking while breaking always uses TEMPLATE_BLOCKS.
	#Allowed Values: PROCESS_QUEUE, TEMPLATE_BLOCKS
	disassembly_mode = "PROCESS_QUEUE"

#Experimental settings
[experimental]
	#EXPERIMENTAL. Run as though Immersive Engineering were not installed, even when it is.
	#Every Immersive Engineering path in Immersive Convergence and Immersive Technology gates off: no wires, no conveyors, no connectors, no IE multiblock templates, and none of the content built out of IE blocks or items. Immersive Petroleum gates off with it, because it cannot work without Immersive Engineering.
	#Recipes that name IE items will have no valid ingredients, multiblocks whose templates are built from IE blocks cannot be assembled, and anything already placed from them will not come back.
	#Turning this on means: I know what I am doing, and I can replace the needed recipes, and NBT data myself.
	#Read once at startup; a change needs a game restart.
	disable_immersive_engineering = false

